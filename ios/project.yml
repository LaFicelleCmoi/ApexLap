# Generate the Xcode project with: xcodegen generate
name: ApexLap
options:
  bundleIdPrefix: com.apexlap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  ApexLapKit:
    path: ApexLapKit
targets:
  ApexLap:
    type: application
    platform: iOS
    sources:
      - ApexLap
    dependencies:
      - package: ApexLapKit
        product: ApexLapDomain
      - package: ApexLapKit
        product: ApexLapData
    info:
      path: ApexLap/Info.plist
      properties:
        CFBundleDisplayName: Apex Lap
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexlap.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ApexLapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ApexLapTests
    dependencies:
      - target: ApexLap
schemes:
  ApexLap:
    build:
      targets:
        ApexLap: all
        ApexLapTests: [test]
    test:
      targets:
        - ApexLapTests
