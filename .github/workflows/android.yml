name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests, build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-lap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release APK (unsigned, signed locally with the private keystore)
        uses: actions/upload-artifact@v4
        with:
          name: apex-lap-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
