name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ApexLapKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Domain + data tests
        working-directory: ios/ApexLapKit
        run: swift test

  app:
    name: App (Xcode)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          # Pick whichever iPhone simulator this runner image ships with.
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project ApexLap.xcodeproj \
            -scheme ApexLap \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Surface the end of the log
        if: failure()
        run: tail -n 40 build.log | sed 's/^/::error title=xcodebuild::/' || true

  simulator:
    name: Simulator build (Appetize)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          # Universal (Apple Silicon + Intel) so browser streaming services can run it.
          xcodebuild build \
            -project ApexLap.xcodeproj \
            -scheme ApexLap \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Zip the .app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/ios/ApexLap-simulator.zip" ApexLap.app
          ls -la "$GITHUB_WORKSPACE/ios/ApexLap-simulator.zip"
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ApexLap-simulator-appetize
          path: ios/ApexLap-simulator.zip
      - name: Surface the end of the log
        if: failure()
        run: tail -n 40 build.log | sed 's/^/::error title=xcodebuild::/' || true

  ipa:
    name: Unsigned IPA (device)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ApexLap.xcodeproj \
            -scheme ApexLap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ApexLap.app Payload/
          zip -qry ApexLap-unsigned.ipa Payload
          ls -la ApexLap-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ApexLap-unsigned-ipa
          path: ios/ApexLap-unsigned.ipa
      - name: Surface the end of the log
        if: failure()
        run: tail -n 40 build.log | sed 's/^/::error title=xcodebuild::/' || true
